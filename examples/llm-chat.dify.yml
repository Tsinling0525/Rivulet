version: "0.6.0"
kind: app
app:
  name: LLM Chat
  mode: advanced-chat
  description: Dify-style chatflow - one llm call then an answer node
  icon: "\U0001F4AC"
  icon_type: emoji
workflow:
  graph:
    nodes:
      - id: "start_node"
        type: custom
        position: {x: 80, y: 282}
        data:
          type: start
          title: Start
          variables:
            - variable: query
              label: query
              type: text-input
              required: true
              max_length: 2000
      - id: "llm_node"
        type: custom
        position: {x: 380, y: 282}
        data:
          type: llm
          title: LLM
          desc: "Set the model name, or override it with --model"
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.3
              max_tokens: 600
          prompt_template:
            - role: system
              text: "You are concisely helpful."
            - role: user
              text: "{{#start_node.query#}}"
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false}
          retry_config:
            enabled: true
            max_retries: 2
            retry_interval: 500
            exponential_backoff:
              enabled: true
              multiplier: 2
              max_interval: 4000
      - id: "answer_node"
        type: custom
        position: {x: 680, y: 282}
        data:
          type: answer
          title: Answer
          answer: "{{#llm_node.text#}}"
    edges:
      - id: "start_node-source-llm_node-target"
        source: "start_node"
        sourceHandle: "source"
        target: "llm_node"
        targetHandle: "target"
      - id: "llm_node-source-answer_node-target"
        source: "llm_node"
        sourceHandle: "source"
        target: "answer_node"
        targetHandle: "target"
    viewport: {x: 0, y: 0, zoom: 0.7}
  features:
    opening_statement: ""
    suggested_questions: []
    file_upload: {enabled: false}
  environment_variables: []
  conversation_variables: []
